<!DOCTYPE html>
<html lang="ja">

<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1T9HP3BLMP"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-1T9HP3BLMP');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, height=630, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&family=Noto+Sans+JP:wght@700&display=swap"
        rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 1200px;
            height: 630px;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Background Effects */
        .bg-glow {
            position: absolute;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.05) 0%, transparent 70%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .planet-icon {
            width: 240px;
            height: auto;
            margin-bottom: 40px;
            filter: drop-shadow(0 0 30px rgba(255, 255, 255, 0.4));
        }

        .brand-name {
            font-size: 6.5rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 4px;
            margin: 0;
            line-height: 1;
        }

        .tagline {
            font-size: 1.5rem;
            color: #888888;
            letter-spacing: 12px;
            margin-top: 30px;
            text-transform: uppercase;
            font-weight: 400;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            padding-top: 25px;
            padding-left: 12px;
            /* Offset for letter-spacing */
        }
    </style>
</head>

<body>
    <div class="bg-glow"></div>
    <div class="content">
        <img src="icon-hp-final.png" alt="Planet Icon" class="planet-icon">
        <h1 class="brand-name">SPACE GLEAM</h1>
        <p class="tagline">PRODUCT / Apparel / Artist</p>
    </div>
</body>

</html>
